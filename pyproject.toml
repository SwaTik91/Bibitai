[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bibitai"
version = "0.1.0"
description = "Conservative Binance spot bot: adaptive range grid with hard risk limits"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
bibitai = "bibitai.cli:main"

[tool.setuptools.packages.find]
include = ["bibitai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
